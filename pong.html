<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Pong Game</title>\n    <style>\n        canvas {\n            background: #000;\n            display: block;\n            margin: 0 auto;\n        }\n    </style>\n</head>\n<body>\n    <canvas id="pong" width="800" height="400"></canvas>\n    <script>\n        const canvas = document.getElementById('pong');\n        const ctx = canvas.getContext('2d');\n\n        // Create the pong paddle\n        const paddleWidth = 10;\n        const paddleHeight = 100;\n        let player = {\n            x: 0,\n            y: canvas.height / 2 - paddleHeight / 2,\n            width: paddleWidth,\n            height: paddleHeight,\n            color: 'WHITE',\n            score: 0\n        };\n\n        let computer = {\n            x: canvas.width - paddleWidth,\n            y: canvas.height / 2 - paddleHeight / 2,\n            width: paddleWidth,\n            height: paddleHeight,\n            color: 'WHITE',\n            score: 0\n        };\n\n        // Create the pong ball\n        const ball = {\n            x: canvas.width / 2,\n            y: canvas.height / 2,\n            size: 10,\n            speed: 4,\n            velocityX: 4,\n            velocityY: 4,\n            color: 'WHITE'\n        };\n\n        // Draw rectangle function\n        function drawRect(x, y, width, height, color) {\n            ctx.fillStyle = color;\n            ctx.fillRect(x, y, width, height);\n        }\n\n        // Draw circle function\n        function drawCircle(x, y, size, color) {\n            ctx.fillStyle = color;\n            ctx.beginPath();\n            ctx.arc(x, y, size, 0, Math.PI * 2, false);\n            ctx.closePath();\n            ctx.fill();\n        }\n\n        // Draw the text function\n        function drawText(text, x, y, color) {\n            ctx.fillStyle = color;\n            ctx.font = '35px Arial';\n            ctx.fillText(text, x, y);\n        }\n\n        // Reset the ball's position and speed\n        function resetBall() {\n            ball.x = canvas.width / 2;\n            ball.y = canvas.height / 2;\n            ball.speed = 4;\n            ball.velocityX = -ball.velocityX;\n        }\n\n        // Update the game function\n        function update() {\n            // Move the paddle\n            if (upPressed && player.y > 0) {\n                player.y -= 8;\n            } else if (downPressed && (player.y < canvas.height - player.height)) {\n                player.y += 8;\n            }\n\n            // Simple AI for computer paddle\n            computer.y += ((ball.y - (computer.y + computer.height / 2)) * 0.09);\n\n            // Move the ball\n            ball.x += ball.velocityX;\n            ball.y += ball.velocityY;\n\n            // Ball collision with top and bottom walls\n            if (ball.y + ball.size > canvas.height || ball.y - ball.size < 0) {\n                ball.velocityY = -ball.velocityY;\n            }\n\n            // Ball collision with paddles\n            let playerPaddle = (ball.x < canvas.width / 2) ? player : computer;\n            if (collision(ball, playerPaddle)) {\n                ball.velocityX = -ball.velocityX;\n                ball.speed += 0.2;\n            }\n\n            // Reset ball if it goes off the canvas\n            if (ball.x - ball.size < 0) {\n                computer.score++;\n                resetBall();\n            } else if (ball.x + ball.size > canvas.width) {\n                player.score++;\n                resetBall();\n            }\n        }\n\n        // Collision detection function\n        function collision(ball, paddle) {\n            return ball.x < paddle.x + paddle.width &&\n                   ball.x + ball.size > paddle.x &&\n                   ball.y < paddle.y + paddle.height &&\n                   ball.y + ball.size > paddle.y;\n        }\n\n        let upPressed = false;\n        let downPressed = false;\n\n        // Control the player paddle\n        document.addEventListener('keydown', (event) => {\n            if (event.key === 'ArrowUp') {\n                upPressed = true;\n            } else if (event.key === 'ArrowDown') {\n                downPressed = true;\n            }\n        });\n\n        document.addEventListener('keyup', (event) => {\n            if (event.key === 'ArrowUp') {\n                upPressed = false;\n            } else if (event.key === 'ArrowDown') {\n                downPressed = false;\n            }\n        });\n\n        // The game loop\n        function game() {\n            update();\n            ctx.clearRect(0, 0, canvas.width, canvas.height);\n            drawRect(player.x, player.y, player.width, player.height, player.color);\n            drawRect(computer.x, computer.y, computer.width, computer.height, computer.color);\n            drawCircle(ball.x, ball.y, ball.size, ball.color);\n            drawText(player.score, canvas.width / 4, canvas.height / 5, 'WHITE');\n            drawText(computer.score, 3 * canvas.width / 4, canvas.height / 5, 'WHITE');\n            requestAnimationFrame(game);\n        }\n\n        // Start the game\n        game();\n    </script>\n</body>\n</html>
